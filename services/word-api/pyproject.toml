[project]
name = "word-api"
version = "0.1.0"
description = "Crossword-focused API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.1",
    "pandas[parquet,performance,xml]>=3.0.1",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.5",
    "uvicorn>=0.30.0",
]

[tool.uv]

[tool.hatch.build.targets.sdist]
packages = ["src/word_api"]

[tool.hatch.build.targets.wheel]
packages = ["src/word_api"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]

[tool.coverage.run]
branch = false
source = ["src"]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "--cache-clear --cov src -vv"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
