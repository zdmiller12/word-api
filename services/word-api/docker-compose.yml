services:
  word-api:
    image: orka12/word-api:latest
    container_name: word-api
    restart: unless-stopped
    ports:
      # LAN access only — public traffic flows through cloudflared, not this port
      - "${API_LAN_IP}:8000:8000"
    volumes:
      - /volume1/docker/word-api/data:/home/nonroot/.local/share/word-api
    user: "999:999"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - word-api
