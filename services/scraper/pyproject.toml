[project]
name = "scraper"
version = "0.1.0"
description = "Tooling to collect crossword data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.5",
]

[project.scripts]
scraper = "scraper.main:main"

[tool.uv]

[tool.hatch.build.targets.sdist]
packages = ["src/scraper"]

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]

[tool.coverage.run]
branch = false
source = ["src"]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "--cache-clear --cov src -vv"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
