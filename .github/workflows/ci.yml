name: CI

permissions:
  contents: read

on:
  pull_request:
  push:

env:
  pip-version: '25.3'
  pre-commit-version: '4.5.1'
  python-version: '3.13'
  uv-version: '0.8.17'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          cache: 'pip' 
          python-version: ${{ env.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install
            pip==${{ env.pip-version }}
            pre-commit==${{ env.pre-commit-version }}

      - name: Run pre-commit
        run: pre-commit run --all-files

      # - name: Install uv
      #   uses: astral-sh/setup-uv@v7
      #   with:
      #     python-version: ${{ env.python-version }}
      #     version: ${{ env.uv-version }}
