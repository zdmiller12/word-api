name: CI

permissions:
  contents: read

on:
  pull_request:
  push:

env:
  pip-version: '25.3'
  pre-commit-version: '4.5.1'
  python-version: '3.13'
  uv-version: '0.8.17'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          cache: 'pip'
          python-version: ${{ env.python-version }}

      - name: Install dependencies
        run: >
          python -m pip install
            pip==${{ env.pip-version }}
            pre-commit==${{ env.pre-commit-version }}

      - name: Run pre-commit
        run: pre-commit run --all-files

  build-and-push-scraper:
    runs-on: ubuntu-latest
    env:
      image-name: ${{ secrets.DOCKERHUB_USERNAME }}/word-scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=registry,ref=${{ env.image-name }}:buildcache
          cache-to: type=registry,ref=${{ env.image-name }}:buildcache,mode=max
          context: ${{ github.workspace }}/services/scraper
          push: true
          tags: |
            ${{ env.image-name }}:latest
            ${{ env.image-name }}:${{ github.sha }}
